pi:
  name: Neal A. Hall
  title: Associate Professor, Temple Foundation Endowed Faculty Fellowship No. 5
  dept: Chandra Family Department of Electrical and Computer Engineering · Microelectronics Research Center
  email: nahall@utexas.edu
  office: EER 4.802
  phone: 512-471-2349
  photo: "neal-hall.jpg"
  bio: >-
    Neal Hall received his B.S. in mechanical engineering from UT Austin (1999) and his M.S. (2002)
    and Ph.D. (2004) in mechanical engineering from the Georgia Institute of Technology. From 2004 to
    2006 he was an Intelligence Community Postdoctoral Fellow at Sandia National Laboratories. He joined
    the UT Austin ECE faculty in January 2009, and founded Silicon Audio, Inc., an Austin company that
    designs, manufactures and sells precision seismic and acoustic sensors. His research spans silicon
    micromachining and MEMS, acoustics and dynamics, optics and photonics, and advanced transducer
    development, with support from NIH, NSF, DOE, NASA and DARPA.
  honors:
    - DARPA Young Faculty Award (2012)
    - ONR Young Investigator Award (2014)
    - UT System Regents' Outstanding Teaching Award (2014)
    - Gordon T. Lepley IV Endowed Memorial Teaching Award (2016)

