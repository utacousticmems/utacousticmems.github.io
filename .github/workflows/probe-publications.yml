# Temporary: runs the new publications check in dry-run mode (changes nothing). Will be removed.
name: Probe publication sources (temporary)
on:
  push:
    branches: [claude/project-thread-ufntq6]
    paths:
      - .github/publications-bot/**
      - .github/workflows/probe-publications.yml
permissions:
  contents: read
  pull-requests: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Dry run of the weekly check
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/publications-bot/update_publications.py --dry-run
