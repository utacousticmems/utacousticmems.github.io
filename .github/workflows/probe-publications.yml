# Temporary: checks which public sources list the group's papers. Will be removed.
name: Probe publication sources (temporary)
on:
  push:
    branches: [claude/project-thread-ufntq6]
    paths:
      - .github/scripts/probe_publications.py
      - .github/workflows/probe-publications.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - run: python .github/scripts/probe_publications.py
