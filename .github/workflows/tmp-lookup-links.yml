# TEMPORARY: removed again before the pull request is opened.
name: Temporary publication link lookup
on:
  push:
    branches: [claude/project-thread-mpoidj]
    paths: [".github/scripts/tmp_lookup_links*.py", ".github/workflows/tmp-lookup-links.yml"]
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: Look up links
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python .github/scripts/tmp_lookup_links3.py
