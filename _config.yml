# ---------------------------------------------------------------
# Hall Group website (UT Austin, Acoustic & Photonic MEMS)
# Most day-to-day edits happen in _data/*.yml and _wiki/*.md.
# See README.md for the editing guide.
# ---------------------------------------------------------------
title: Hall Group
tagline: MEMS and photonic sensors at UT Austin
description: >-
  The Hall Group (Hall Lab, formerly UT Acoustic MEMS), led by Prof. Neal A. Hall
  at The University of Texas at Austin, builds acoustic and photonic MEMS sensors:
  microphones, accelerometers, ultrasonic transducers and hydrophones.
author: Neal A. Hall

# If the repo is named <org>.github.io, leave baseurl empty.
# If it is a project repo (e.g. github.com/<org>/hall-group), set baseurl: /hall-group
url: "https://utacousticmems.github.io"
baseurl: ""

pi_email: nahall@utexas.edu
scholar_url: "https://scholar.google.com/scholar?q=%22Neal+A.+Hall%22+MEMS"
old_site: "https://sites.google.com/site/utacousticmems/home"
# Set this after creating the GitHub repo, e.g. https://github.com/utacousticmems/utacousticmems.github.io
repo_url: "https://github.com/utacousticmems/utacousticmems.github.io"

collections:
  wiki:
    output: true
    permalink: /wiki/:name/

defaults:
  - scope: { path: "", type: wiki }
    values: { layout: wiki }
  - scope: { path: "" }
    values: { layout: page }

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Search engines. After verifying the site in Google Search Console with the
# "HTML tag" method, paste only the content="..." value here.
webmaster_verifications:
  google: "uotiK7sV5HXx2OyBG46rdsNrNR3h4_WEALtrKHlQHII"

social:
  name: Hall Group, UT Austin

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - _templates
