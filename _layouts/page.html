---
layout: default
---
<section class="page-head">
  <div class="wrap">
    {% if page.kicker %}<p class="eyebrow reveal">{{ page.kicker }}</p>{% endif %}
    <h1 class="reveal">{{ page.title }}</h1>
    {% if page.lede %}<p class="lede reveal">{{ page.lede }}</p>{% endif %}
  </div>
</section>
<div class="{% if page.wide %}wrap-wide{% else %}wrap{% endif %} page-body">
  {{ content }}
</div>
